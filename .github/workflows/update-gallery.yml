name: Update gallery manifest

on:
  push:
    paths:
      - 'images/gallery/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate manifest.json
        run: node generate-gallery.js

      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/gallery/manifest.json
          git diff --cached --quiet || git commit -m "chore: update gallery manifest"
          git push
